<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yarukoto — things to do</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23B23A2E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="title"><span class="jp">やること</span> Yarukoto</h1>
      <p class="date" id="today-date"></p>
    </header>

    <section class="list-section" aria-labelledby="daily-heading">
      <h2 id="daily-heading">Daily</h2>
      <ul class="task-list" id="daily-list"></ul>
      <p class="empty-note" id="daily-empty" hidden>No daily habits yet. Add one below.</p>
    </section>

    <section class="list-section" aria-labelledby="today-heading">
      <h2 id="today-heading">Today</h2>
      <ul class="task-list" id="today-list"></ul>
      <p class="empty-note" id="today-empty" hidden>Nothing pending. Add a task below.</p>
    </section>

    <p class="all-done-note" id="all-done-note" hidden>All done for today.</p>

    <form class="add-form" id="add-form">
      <input type="text" id="add-input" placeholder="Add a task…" maxlength="120" autocomplete="off" required>
      <div class="add-controls">
        <label class="type-choice">
          <input type="radio" name="task-type" value="daily" checked>
          <span>Daily</span>
        </label>
        <label class="type-choice">
          <input type="radio" name="task-type" value="today">
          <span>Just today</span>
        </label>
        <button type="submit">Add</button>
      </div>
    </form>

    <footer class="page-footer">
      <button type="button" class="link-button" id="history-toggle" aria-expanded="false" aria-controls="history-panel">history</button>
      <button type="button" class="link-button" id="export-button">export</button>
      <label class="link-button file-label">
        import
        <input type="file" id="import-input" accept="application/json" hidden>
      </label>
    </footer>

    <section class="history-panel" id="history-panel" hidden>
      <h2>History</h2>
      <div id="history-daily"></div>
      <h3>Completed</h3>
      <ul class="history-list" id="history-today"></ul>
      <p class="empty-note" id="history-empty" hidden>Nothing completed yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
